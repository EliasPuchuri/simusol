name: images

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Backend tests (inside the runtime image base)
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: test
          cache-from: type=gha,scope=api
      - name: Web type-check and tests
        uses: docker/build-push-action@v6
        with:
          context: web
          target: test
          cache-from: type=gha,scope=web

  publish:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - name: Image tags
        id: tags
        run: |
          SHA="sha-${GITHUB_SHA::7}"
          for img in api web; do
            T="ghcr.io/${OWNER}/simusol-${img}:${SHA},ghcr.io/${OWNER}/simusol-${img}:latest"
            if [ "${GITHUB_REF_TYPE}" = "tag" ]; then T="${T},ghcr.io/${OWNER}/simusol-${img}:${GITHUB_REF_NAME}"; fi
            echo "${img}=${T}" >> "$GITHUB_OUTPUT"
          done
      - name: Publish api
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: runtime
          push: true
          tags: ${{ steps.tags.outputs.api }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Publish web
        uses: docker/build-push-action@v6
        with:
          context: web
          target: runtime
          push: true
          tags: ${{ steps.tags.outputs.web }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
